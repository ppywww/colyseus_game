# Grafana 数据源自动供给（Provisioning）
# 容器启动时自动注册 Prometheus 数据源，无需在 Web UI 手动添加。

apiVersion: 1

datasources:
  - name: Prometheus
    uid: colyseus-fps-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: GET
      timeInterval: 5s

# Prometheus 抓取配置
# 目标：运行在宿主机（Windows）上的 Colyseus 服务端 /metrics 端点。
# Docker Desktop 下使用 host.docker.internal 访问宿主机端口（已在 compose 中映射 host-gateway）。

global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    project: colyseus-fps-prototype

rule_files:
  # 告警规则文件（安全增强章节补充：异常消息速率、房间数突增、审计写入失败等）
  # - alerts.yml

scrape_configs:
  # 1. Colyseus 服务端业务指标
  - job_name: colyseus-fps-server
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - "host.docker.internal:9464"
        labels:
          app: server
          env: development

  # 2. Prometheus 自身健康指标
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          app: prometheus

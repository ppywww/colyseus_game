<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>角色定妆 · 离线预览</title>
    <!--
      角色定妆预览（开发用，不参与构建）。

      为什么需要它：`scripts/preview-viewmodel.mts` 是软光栅 + 平光着色，用来判断
      "轮廓对不对、枪在不在手上"够用；但它的每个三角形取一个法线，球面会被渲成一圈
      锯齿——用它评估"脸上这点毛色过度自然不自然"会得出错误结论。这里用真实 WebGL
      渲一帧，光照参数与 `map.ts` 的厨房灯完全一致，看到的颜色就是玩家看到的颜色。

      用法（先 `pnpm dev:client`）：
        http://127.0.0.1:5173/tools/avatar-preview.html?team=CT&yaw=0
      参数：team（T/CT）、yaw（朝向弧度）、only（只画某一只：tom/jerry/spike/butch）、
            w/h（画布尺寸）。
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6e3c4;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { AvatarModel } from "/src/game/avatar-model.ts";

      const params = new URLSearchParams(location.search);
      const team = params.get("team") === "T" ? "T" : "CT";
      const yaw = Number(params.get("yaw") ?? "0");
      const only = params.get("only");
      const cast = only === null ? ["tom", "jerry", "spike", "butch"] : [only];

      const width = Number(params.get("w") ?? "1600");
      const height = Number(params.get("h") ?? "900");

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(width, height);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      // 背景取厨房地砖的中性暖灰：既不是纯白（会把毛色看淡），也不是纯黑
      scene.background = new THREE.Color(0xf1e3cc);

      const camera = new THREE.PerspectiveCamera(26, width / height, 0.1, 200);

      // ---- 灯光：与 map.ts 的厨房灯同一套参数 ----
      scene.add(new THREE.HemisphereLight(0xfff4e0, 0xdcc8a9, 1.3));
      const sun = new THREE.DirectionalLight(0xfff1d6, 1.45);
      sun.position.set(2.2, 3.4, -2.6);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -6;
      sun.shadow.camera.right = 6;
      sun.shadow.camera.top = 6;
      sun.shadow.camera.bottom = -6;
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far = 30;
      sun.shadow.bias = -0.0008;
      // 弧面自阴影 acne 的标准解：按法线偏移采样点，别只调 bias
      sun.shadow.normalBias = 0.02;
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0xffd9a8, 0.35);
      fill.position.set(-3, 2.4, -2.4);
      scene.add(fill);

      // 地面：一块比背景略深的圆盘，脚才不像"浮着"
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(6, 48),
        new THREE.MeshStandardMaterial({ color: 0xe4cfa9, roughness: 0.95 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      // 相机在 −Z 侧看正面，屏幕 x 与实际 x 反号：按倒序排，画面上才是"tom 在最左"
      const ordered = [...cast].reverse();
      const spacing = 0.86;
      const avatars = ordered.map((id, i) => {
        const avatar = new AvatarModel(team, id);
        avatar.root.position.x = (i - (cast.length - 1) / 2) * spacing;
        avatar.root.rotation.y = yaw;
        scene.add(avatar.root);
        return avatar;
      });

      // 相机：正对角色正面（角色前方是 −Z），略微俯视
      const centerX = 0;
      const frameHeight = 2.05;
      const distance = frameHeight / 2 / Math.tan((camera.fov * Math.PI) / 360);
      camera.position.set(centerX, 1.02, -distance - 0.35);
      camera.lookAt(centerX, 0.92, 0);

      renderer.render(scene, camera);
      // 无头截图要等一帧，标记一下方便脚本判断
      document.title = `ready:${avatars.length}`;
    </script>
  </body>
</html>
